<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Event Plan - Event2Plan</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="result-container">

    <h1>🎉 Your Event Plan</h1>

    <p class="subtitle">
        Your event has been analyzed using NLP.
    </p>


    <div class="result-section">

        <h2>📅 Event Type</h2>

        <p id="eventType"></p>

    </div>


    <div class="result-section">

        <h2>👥 Number of People</h2>

        <p id="people"></p>

    </div>


    <div class="result-section">

        <h2>📍 Location</h2>

        <p id="location"></p>

    </div>


    <div class="result-section">

        <h2>💰 Budget</h2>

        <p id="budget"></p>

    </div>


    <div class="result-section">

        <h2>📋 Requirements</h2>

        <ul id="requirements"></ul>

    </div>


    <div class="result-section">

        <h2>🍽️ Suggested Menu</h2>

        <ul id="menu"></ul>

    </div>


    <div class="result-section">

        <h2>🎵 Music Suggestions</h2>

        <ul id="music"></ul>

    </div>


    <div class="result-section">

        <h2>🎈 Decoration Ideas</h2>

        <ul id="decorations"></ul>

    </div>


    <div class="result-section">

        <h2>✅ Event Checklist</h2>

        <ul id="checklist"></ul>

    </div>


    <button onclick="createAnotherEvent()">
        Create Another Event
    </button>

</div>


<script>

const storedData =
    sessionStorage.getItem("eventPlan");


if (!storedData) {

    alert("Please create an event first.");

    window.location.href = "index.html";

} else {

    const data = JSON.parse(storedData);

    console.log("FINAL EVENT DATA:", data);


    document.getElementById("eventType").innerText =
        data.event_type || "Custom Event";


    document.getElementById("people").innerText =
        data.people || "Not specified";


    document.getElementById("location").innerText =
        data.location || "Not specified";


    document.getElementById("budget").innerText =
        data.budget || "Not specified";


    showList(
        "requirements",
        data.requirements
    );


    showList(
        "menu",
        data.menu
    );


    showList(
        "music",
        data.music
    );


    showList(
        "decorations",
        data.decorations
    );


    showList(
        "checklist",
        data.checklist
    );
}


function showList(id, items) {

    const list =
        document.getElementById(id);

    list.innerHTML = "";


    if (!Array.isArray(items) ||
        items.length === 0) {

        const li =
            document.createElement("li");

        li.innerText =
            "No suggestions available.";

        list.appendChild(li);

        return;
    }


    items.forEach(function(item) {

        const li =
            document.createElement("li");

        li.innerText = item;

        list.appendChild(li);

    });
}


function createAnotherEvent() {

    sessionStorage.removeItem("eventPlan");

    window.location.href = "index.html";
}

</script>

</body>

</html>
