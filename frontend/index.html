<script>

async function generatePlan() {

    const text = document.getElementById("eventText").value.trim();
    const status = document.getElementById("status");

    if (!text) {
        status.textContent = "Please describe your event first.";
        return;
    }

    status.textContent = "⏳ Generating your smart event plan...";

    try {

        const response = await fetch("/generate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: text
            })
        });

        const data = await response.json();

        console.log("Backend response:", data);

        if (!response.ok) {
            throw new Error(data.error || "Server error");
        }

        if (data.error) {
            throw new Error(data.error);
        }

        localStorage.setItem("eventPlan", JSON.stringify(data));

        status.textContent = "✅ Event plan generated successfully!";

        setTimeout(() => {
            window.location.href = "/result.html";
        }, 500);

    } catch (error) {

        console.error("Generate error:", error);

        status.textContent = "❌ " + error.message;
    }
}


function useExample(text) {
    document.getElementById("eventText").value = text;
}

</script>
